<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PitBoard Downloads</title>
  <meta name="theme-color" content="#12151c" />
  <link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../styles.css?v=3" />
  <style>
    .counter { width: min(880px, 100% - 32px); margin: 0 auto; padding: 48px 0 72px; }
    .counter-head { display: flex; align-items: center; gap: 14px; }
    .counter-head img { width: 44px; height: 44px; }
    .counter-head h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .counter-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }

    .total {
      margin-top: 32px;
      padding: 32px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }
    .total::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 4px;
      background: linear-gradient(90deg, var(--red) 0 50%, var(--blue) 50% 100%);
    }
    .label { margin: 0; color: var(--muted); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .total-value {
      margin: 6px 0 0;
      font: 800 clamp(3.6rem, 13vw, 6rem)/1 var(--display);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .total-sub { margin: 10px 0 0; color: var(--tagline); }

    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .tile { padding: 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
    .tile-name { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; }
    .tile-name img { width: 28px; height: 28px; border-radius: 7px; }
    .tile-value { margin: 14px 0 0; font: 800 2.6rem/1 var(--display); font-variant-numeric: tabular-nums; }
    .tile-sub { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
    .share { margin-top: 16px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
    .share span { display: block; height: 100%; width: 0; border-radius: 4px; transition: width 0.4s ease; }
    .tile-win .share span { background: var(--red); }
    .tile-and .share span { background: var(--blue); }

    .releases { margin-top: 32px; }
    .releases h2 { font-size: 1.15rem; }
    .table-wrap { margin-top: 12px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    td { color: var(--tagline); font-variant-numeric: tabular-nums; }
    td.num, th.num { text-align: right; }
    td.strong { color: var(--text); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }

    .status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 24px; color: var(--muted); font-size: 0.9rem; }
    .status button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: 600 0.9rem inherit; cursor: pointer;
    }
    .status button:hover { background: var(--surface-2); }
    .status button:disabled { opacity: 0.6; cursor: default; }
    .status svg { width: 16px; height: 16px; fill: currentColor; }
    .status .error { color: #ff8a93; }
    .note { margin-top: 10px; color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 600px) {
      .counter { padding-top: 32px; }
      .total { padding: 24px; }
      .tiles { grid-template-columns: 1fr; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <main class="counter">
    <header class="counter-head">
      <img src="../assets/logo-mark.svg" alt="" />
      <div>
        <h1>Downloads</h1>
        <p>PitBoard installers downloaded from the website</p>
      </div>
    </header>

    <section class="total" aria-labelledby="total-label">
      <p class="label" id="total-label">Total downloads</p>
      <p class="total-value" id="total" aria-live="polite">–</p>
      <p class="total-sub" id="total-sub">Loading…</p>
    </section>

    <div class="tiles">
      <section class="tile tile-win" aria-labelledby="win-label">
        <p class="tile-name" id="win-label"><img src="../assets/windows-icon.svg" alt="" />Windows</p>
        <p class="tile-value" id="win">–</p>
        <p class="tile-sub" id="win-sub">&nbsp;</p>
        <div class="share" aria-hidden="true"><span id="win-bar"></span></div>
      </section>
      <section class="tile tile-and" aria-labelledby="and-label">
        <p class="tile-name" id="and-label"><img src="../assets/phone-app-icon.svg" alt="" />Android</p>
        <p class="tile-value" id="and">–</p>
        <p class="tile-sub" id="and-sub">&nbsp;</p>
        <div class="share" aria-hidden="true"><span id="and-bar"></span></div>
      </section>
    </div>

    <section class="releases" aria-labelledby="releases-h">
      <h2 id="releases-h">By version</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Version</th><th>Published</th><th class="num">Windows</th><th class="num">Android</th><th class="num">Total</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <div class="status">
      <button type="button" id="refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
        Refresh
      </button>
      <span id="updated"></span>
    </div>
    <p class="note">Counted by GitHub each time an installer is downloaded from the release. GitHub saves the counts here every 10 minutes.</p>
  </main>

  <script>
    (function () {
      // Written by the deploy workflow every 10 minutes, so viewers never call GitHub's API themselves.
      var DATA_URL = 'data.json';
      var REFRESH_MS = 2 * 60 * 1000;
      // GitHub's counts can't be reset, so the counter starts from these totals (11 Oct 2026, 18:28 UTC).
      // Keyed by asset id: a re-uploaded file gets a new id and counts from 0 on its own.
      var BASELINE = { 606601981: 2 };
      var COUNTING_SINCE = 'Counting since 11 Oct 2026';
      var nf = new Intl.NumberFormat('en-US');
      var $ = function (id) { return document.getElementById(id); };

      function platformOf(name) {
        if (/\.exe$/i.test(name)) return 'win';
        if (/\.apk$/i.test(name)) return 'and';
        return null;
      }

      function summarize(releases) {
        var totals = { win: 0, and: 0 };
        var rows = releases.map(function (r) {
          var row = { name: r.name, date: r.published_at, win: 0, and: 0 };
          r.assets.forEach(function (a) {
            var p = platformOf(a.name);
            var count = Math.max(0, a.download_count - (BASELINE[a.id] || 0));
            if (p) { row[p] += count; totals[p] += count; }
          });
          return row;
        });
        return { totals: totals, rows: rows };
      }

      function percent(part, whole) {
        return whole ? Math.round((part / whole) * 100) : 0;
      }

      function render(data) {
        var t = data.totals;
        var all = t.win + t.and;
        $('total').textContent = nf.format(all);
        $('total-sub').textContent = COUNTING_SINCE + (data.rows.length === 1 ? ' · 1 version' : ' · ' + data.rows.length + ' versions');
        ['win', 'and'].forEach(function (k) {
          $(k).textContent = nf.format(t[k]);
          $(k + '-sub').textContent = percent(t[k], all) + '% of all downloads';
          $(k + '-bar').style.width = percent(t[k], all) + '%';
        });
        $('rows').replaceChildren.apply($('rows'), data.rows.map(function (r) {
          var tr = document.createElement('tr');
          var cells = [
            [r.name, 'strong'],
            [r.date ? new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '–', ''],
            [nf.format(r.win), 'num'],
            [nf.format(r.and), 'num'],
            [nf.format(r.win + r.and), 'num strong'],
          ];
          cells.forEach(function (c) {
            var td = document.createElement('td');
            td.textContent = c[0];
            if (c[1]) td.className = c[1];
            tr.appendChild(td);
          });
          return tr;
        }));
      }

      function stamp(text, isError) {
        var el = $('updated');
        el.textContent = text;
        el.className = isError ? 'error' : '';
      }

      function time(d) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function load() {
        var button = $('refresh');
        button.disabled = true;
        return fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error(res.status === 404 ? 'No counts saved yet' : 'Could not load the counts (' + res.status + ')');
            return res.json();
          })
          .then(function (data) {
            render(summarize(data.releases));
            stamp('Counts from ' + time(new Date(data.generated_at)), false);
          })
          .catch(function (err) {
            stamp(err.message === 'Failed to fetch' ? 'No connection' : err.message, true);
          })
          .then(function () { button.disabled = false; });
      }

      $('refresh').addEventListener('click', load);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
      setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
      load();
    })();
  </script>
</body>
</html>
