<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PitBoard Downloads</title>
  <meta name="theme-color" content="#12151c" />
  <link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../styles.css?v=10" />
  <style>
    .counter { width: min(760px, 100% - 32px); margin: 0 auto; padding: 56px 0 72px; text-align: center; }
    .counter-head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .counter-head img { width: 52px; height: 52px; }
    .counter-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
    .counter-head p { margin: 0; color: var(--muted); font-size: 0.95rem; }

    .total {
      position: relative;
      margin-top: 36px;
      padding: 40px 24px 36px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .total::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 4px;
      background: linear-gradient(90deg, var(--red) 0 50%, var(--blue) 50% 100%);
    }
    .label { margin: 0; color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .total-value {
      margin: 10px 0 0;
      font: 800 clamp(4rem, 15vw, 6.5rem)/1 var(--display);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .total-sub { margin: 14px 0 0; color: var(--tagline); }

    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .tile {
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 20px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .tile-name { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0; color: var(--text); font-weight: 600; }
    .tile-name img { width: 28px; height: 28px; border-radius: 7px; }
    .tile-value { margin: 16px 0 0; font: 800 3rem/1 var(--display); font-variant-numeric: tabular-nums; }
    .tile-sub { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
    .share { width: 100%; max-width: 240px; margin-top: 16px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
    .share span { display: block; height: 100%; width: 0; border-radius: 4px; transition: width 0.4s ease; }
    .tile-win .share span { background: var(--red); }
    .tile-and .share span { background: var(--blue); }

    .status { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px; margin-top: 28px; color: var(--muted); font-size: 0.9rem; }
    .status button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .status button:hover { background: var(--surface-2); }
    .status button:disabled { opacity: 0.6; cursor: default; }
    .status svg { width: 16px; height: 16px; fill: currentColor; }
    .status .error { color: #ff8a93; }
    .note { margin: 10px auto 0; max-width: 34em; color: var(--muted); font-size: 0.85rem; }

    .goals { margin-top: 16px; padding: 28px 28px 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
    .goals h2 { font-size: 1.1rem; }
    .goal { margin-top: 20px; text-align: left; }
    .goal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .goal-name { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
    .goal-name i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .goal-nums { color: var(--tagline); font-variant-numeric: tabular-nums; }
    .goal-nums b { color: var(--text); font-weight: 700; }
    .goal-bar { margin-top: 8px; height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
    .goal-bar span { display: block; height: 100%; width: 0; border-radius: 6px; transition: width 0.5s ease; }
    .goal-sub { margin: 6px 0 0; color: var(--muted); font-size: 0.85rem; }
    .goal-sub.done { color: var(--green); }
    .goal-win i, .goal-win .goal-bar span { background: var(--red); }
    .goal-and i, .goal-and .goal-bar span { background: var(--blue); }
    .goal-all i, .goal-all .goal-bar span { background: linear-gradient(90deg, var(--red), var(--blue)); }

    @media (max-width: 560px) {
      .counter { padding-top: 36px; }
      .tiles { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="counter">
    <header class="counter-head">
      <img src="../assets/logo-mark.svg" alt="" />
      <div>
        <h1>Downloads</h1>
        <p>PitBoard installers downloaded from the website</p>
      </div>
    </header>

    <section class="total" aria-labelledby="total-label">
      <p class="label" id="total-label">All downloads</p>
      <p class="total-value" id="total" aria-live="polite">–</p>
      <p class="total-sub" id="total-sub">Loading…</p>
    </section>

    <div class="tiles">
      <section class="tile tile-win" aria-labelledby="win-label">
        <p class="tile-name" id="win-label"><img src="../assets/windows-icon.svg" alt="" />Windows</p>
        <p class="tile-value" id="windows">–</p>
        <p class="tile-sub" id="windows-sub">&nbsp;</p>
        <div class="share" aria-hidden="true"><span id="windows-bar"></span></div>
      </section>
      <section class="tile tile-and" aria-labelledby="and-label">
        <p class="tile-name" id="and-label"><img src="../assets/phone-app-icon.svg" alt="" />Android</p>
        <p class="tile-value" id="android">–</p>
        <p class="tile-sub" id="android-sub">&nbsp;</p>
        <div class="share" aria-hidden="true"><span id="android-bar"></span></div>
      </section>
    </div>

    <section class="goals" aria-labelledby="goals-title">
      <h2 id="goals-title">Progress to target</h2>
      <div class="goal goal-win" id="goal-windows">
        <div class="goal-head">
          <span class="goal-name"><i aria-hidden="true"></i>Windows</span>
          <span class="goal-nums" id="goal-windows-nums">–</span>
        </div>
        <div class="goal-bar" role="progressbar" aria-label="Windows downloads toward the target" aria-valuemin="0" aria-valuemax="100" id="goal-windows-bar"><span></span></div>
        <p class="goal-sub" id="goal-windows-sub">&nbsp;</p>
      </div>
      <div class="goal goal-and" id="goal-android">
        <div class="goal-head">
          <span class="goal-name"><i aria-hidden="true"></i>Android</span>
          <span class="goal-nums" id="goal-android-nums">–</span>
        </div>
        <div class="goal-bar" role="progressbar" aria-label="Android downloads toward the target" aria-valuemin="0" aria-valuemax="100" id="goal-android-bar"><span></span></div>
        <p class="goal-sub" id="goal-android-sub">&nbsp;</p>
      </div>
      <div class="goal goal-all" id="goal-total">
        <div class="goal-head">
          <span class="goal-name"><i aria-hidden="true"></i>All downloads</span>
          <span class="goal-nums" id="goal-total-nums">–</span>
        </div>
        <div class="goal-bar" role="progressbar" aria-label="All downloads downloads toward the target" aria-valuemin="0" aria-valuemax="100" id="goal-total-bar"><span></span></div>
        <p class="goal-sub" id="goal-total-sub">&nbsp;</p>
      </div>
    </section>

    <div class="status">
      <button type="button" id="refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
        Refresh
      </button>
      <span id="updated"></span>
    </div>
    <p class="note">Each click on a download button on the website adds one. Updates every 30 seconds while this page is open.</p>
  </main>

  <script>
    (function () {
      var COUNTS_URL = 'https://rpkaxccjkwimirncyynt.supabase.co/rest/v1/download_counts?select=windows,android,total,updated_at,target_windows,target_android,target_total&id=eq.1';
      var KEY = 'sb_publishable_eESVbxId7MKgmXqoQs8JKA_JHhBIDd-';
      var REFRESH_MS = 30 * 1000;
      var nf = new Intl.NumberFormat('en-US');
      var $ = function (id) { return document.getElementById(id); };

      function percent(part, whole) {
        return whole ? Math.round((part / whole) * 100) : 0;
      }

      function time(d) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function renderGoal(key, count, target) {
        var box = $('goal-' + key);
        box.hidden = !target;
        if (!target) return;
        var pct = Math.min(100, Math.round((count / target) * 100));
        $('goal-' + key + '-nums').innerHTML = '';
        var b = document.createElement('b');
        b.textContent = nf.format(count);
        $('goal-' + key + '-nums').append(b, ' of ' + nf.format(target) + ' · ' + pct + '%');
        var bar = $('goal-' + key + '-bar');
        bar.setAttribute('aria-valuenow', pct);
        bar.firstElementChild.style.width = pct + '%';
        var sub = $('goal-' + key + '-sub');
        var left = target - count;
        sub.textContent = left > 0 ? nf.format(left) + ' to go' : 'Target reached';
        sub.className = 'goal-sub' + (left > 0 ? '' : ' done');
      }

      function render(row) {
        $('total').textContent = nf.format(row.total);
        ['windows', 'android'].forEach(function (k) {
          $(k).textContent = nf.format(row[k]);
          $(k + '-sub').textContent = percent(row[k], row.total) + '% of all downloads';
          $(k + '-bar').style.width = percent(row[k], row.total) + '%';
        });
        ['windows', 'android', 'total'].forEach(function (k) { renderGoal(k, row[k], row['target_' + k]); });
        var last = new Date(row.updated_at);
        $('total-sub').textContent = row.total
          ? 'Last download ' + last.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + time(last)
          : 'Counting since 11 Oct 2026';
      }

      function stamp(text, isError) {
        var el = $('updated');
        el.textContent = text;
        el.className = isError ? 'error' : '';
      }

      function load() {
        var button = $('refresh');
        button.disabled = true;
        return fetch(COUNTS_URL, { headers: { apikey: KEY }, cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('Could not load the counts (' + res.status + ')');
            return res.json();
          })
          .then(function (rows) {
            if (!rows.length) throw new Error('No counts found');
            render(rows[0]);
            stamp('Updated ' + time(new Date()), false);
          })
          .catch(function (err) {
            stamp(err.message === 'Failed to fetch' ? 'No connection' : err.message, true);
          })
          .then(function () { button.disabled = false; });
      }

      $('refresh').addEventListener('click', load);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
      setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
      load();
    })();
  </script>
</body>
</html>
